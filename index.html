<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diwi Labs</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 1.5rem;
    }

    main {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 5rem 0 3rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #111;
      margin-bottom: 0.5rem;
    }

    .body-text {
      font-size: 1rem;
      line-height: 1.75;
      color: #444;
      margin-bottom: 2.5rem;
    }

    .contact {
      font-size: 0.9375rem;
      color: #555;
    }

    .contact a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #bbb;
    }

    .contact a:hover {
      text-decoration-color: #111;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 1rem;
    }

    .projects {
      margin-bottom: 2.5rem;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9375rem;
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #bbb;
    }

    .project-link:hover {
      text-decoration-color: #111;
    }

    footer {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 0;
      border-top: 1px solid #e8e8e8;
      font-size: 0.875rem;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <h1>Diwi Labs</h1>
    <p class="body-text">Building software.</p>
    <div class="projects">
      <p class="section-label">Projects</p>
      <a class="project-link" href="https://justaudio.stream" target="_blank" rel="noopener">justaudio.stream</a>
    </div>
    <p class="contact">Contact: <a href="mailto:ask@diwilabs.com">ask@diwilabs.com</a></p>
  </main>
  <footer>
    <span>© 2026 Diwi Labs LLC</span>
  </footer>
</body>
</html>
